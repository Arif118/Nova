<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Nova AI</title>
</head>

<body>
  <aside class="sidebar">
    <div class="logo">✦ Nova AI</div>
    <a href="https://nova-chatbot-soo9.onrender.com/" style="text-decoration: none;"><div class="new-chat">+ New Chat</div> </a>
    <p>RECENT CHATS</p>
    <div class="history">
      <div>◈ Python Programming</div>
      <div>◈ Machine Learning</div>
      <div>◈ AI Project Ideas</div>
      <div>◈ General Questions</div>
    </div>
  </aside>
  <main class="main">
    <header>Nova AI <span>●</span></header>
    <section class="chat">
      <div class="message bot">
        <div class="avatar">AI</div>
        <div class="content">
          <h3>Hello! 👋</h3>
          I'm Nova, your AI assistant. How can I help you today?
        </div>
      </div>

    </section>
    <div class="input-area">
      <div class="input-box">
        <input type="text" placeholder="Message Nova AI...">
        <button>➤</button>
      </div>
      <div class="footer">AI can make mistakes. Verify important information.</div>
    </div>
  </main>
  <script>
    // Get HTML elements
const input = document.querySelector("input");
const button = document.querySelector("button");
const chat = document.querySelector(".chat");

// Store conversation history
let history = [];

// Send message to AI
async function sendMessage() {

    const message = input.value.trim();

    if (!message) return;

    // Display user message
    const userDiv = document.createElement("div");
    userDiv.className = "user";
    userDiv.textContent = message;

    chat.appendChild(userDiv);

    input.value = "";

    // Disable button while AI responds
    button.disabled = true;
    button.textContent = "...";

    try {
        // Send message to FastAPI
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                history: history
            })
        });

        if (!response.ok) {
            throw new Error("Backend error: " + response.status);
        }

        // Get AI response
        const data = await response.json();

        // Create AI message
        const botDiv = document.createElement("div");
        botDiv.className = "message bot";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "AI";

        const content = document.createElement("div");
        content.className = "content";
        content.textContent = data.reply;

        botDiv.append(avatar, content);
        chat.appendChild(botDiv);

        // Update conversation history
        history.push(
            { role: "user", content: message },
            { role: "assistant", content: data.reply }
        );
        
    } catch (error) {

        console.error(error);

        const errorDiv = document.createElement("div");
        errorDiv.className = "message bot";
        errorDiv.textContent = "Error: " + error.message;

        chat.appendChild(errorDiv);
    }

    // Restore button
    button.disabled = false;
    button.textContent = "➤";

    chat.scrollTop = chat.scrollHeight;
    input.focus();
}

// Button click event
button.addEventListener("click", sendMessage);

// Enter key event
input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

  </script>
</body>
</html>
